services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - USER_ID=root
      - DB_PASSWORD=1234
      - DB_HOST=db:3306
      - DB_NAME=hr_risk_db
    depends_on:
      - db

  db:
    image: mysql:latest
    restart: always
    environment:
      MYSQL_DATABASE: hr_risk_db
      MYSQL_USER: user
      MYSQL_PASSWORD: 1234
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend-fastapi/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data: